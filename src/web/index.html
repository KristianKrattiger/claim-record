<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claim / Record</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    .piles { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .pile { border: 1px dashed #888; min-height: 8rem; padding: 0.75rem; }
    .pile h2 { font-size: 0.95rem; margin: 0 0 0.5rem; }
    label, button { display: block; margin: 0.75rem 0; }
    pre { white-space: pre-wrap; font-size: 0.85rem; }
    .row { border-left: 3px solid #888; padding-left: 0.75rem; margin: 1rem 0; }
    .divergent { border-color: #e03131; }
    .unverified { border-color: #ced4da; }
    .context_unverified { border-color: #f08c00; }
    .corroborated { border-color: #2f9e44; }
    .tag { font-weight: 700; }
    .tag.divergent { color: #e03131; }
    .tag.unverified { color: #f8f9fa; }
    .tag.context_unverified { color: #f08c00; }
    .tag.corroborated { color: #2f9e44; }
    @media (prefers-color-scheme: light) {
      .tag.unverified { color: #868e96; }
    }
    .audit { font-size: 0.85rem; color: #666; margin: 1rem 0; }
    .audit ul { margin: 0.35rem 0 0; padding-left: 1.25rem; }
    .refusal { color: #b00; }
    .note { color: #666; font-size: 0.85rem; }
    .files { font-size: 0.85rem; margin-top: 0.5rem; }
    .file-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.25rem 0; }
    .file-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row button, .pile-clear { display: inline-block; margin: 0; font-size: 0.8rem; }
    .clear-all { margin: 0.75rem 0 0.25rem; }
  </style>
</head>
<body>
  <h1>Claim / Record</h1>
  <p class="note">Not legal advice. Quotes must be exact substrings of the files you upload. Only <code>.txt</code> and <code>.md</code>. The subject must appear in those quotes — a default like <code>uptime</code> will mass-deny a legal pile.</p>
  <div class="piles">
    <div class="pile" id="claim-drop">
      <h2>Claim</h2>
      <input type="file" id="claim" accept=".txt,.md,text/plain,text/markdown" multiple />
      <div class="files" id="claim-list"></div>
      <button type="button" class="pile-clear" id="clear-claim" hidden>Clear Claim</button>
    </div>
    <div class="pile" id="record-drop">
      <h2>Record</h2>
      <input type="file" id="record" accept=".txt,.md,text/plain,text/markdown" multiple />
      <div class="files" id="record-list"></div>
      <button type="button" class="pile-clear" id="clear-record" hidden>Clear Record</button>
    </div>
  </div>
  <button type="button" class="clear-all" id="clear-all" hidden>Clear all</button>
  <label>Subject <input id="subject" type="text" value="" placeholder="must appear in the quotes" /></label>
  <label>Model
    <select id="client">
      <option value="anthropic">Anthropic (ANTHROPIC_API_KEY)</option>
      <option value="ollama">Ollama (local)</option>
    </select>
  </label>
  <label><input id="narrate" type="checkbox" /> Narrate (experimental) — off by default; restates ledger rows only</label>
  <button id="run" type="button">Run</button>
  <div id="out"></div>
  <script type="module">
    const ALLOWED = new Set([".txt", ".md"])
    let nextId = 1
    const claimDocs = []
    const recordDocs = []

    function extensionOf(name) {
      const i = name.lastIndexOf(".")
      return i === -1 ? "" : name.slice(i).toLowerCase()
    }

    function payload(docs) {
      return docs.map(({ name, text }) => ({ name, text }))
    }

    function renderPile(listId, clearId, docs, onDelete) {
      const list = document.getElementById(listId)
      const clear = document.getElementById(clearId)
      const all = document.getElementById("clear-all")
      list.replaceChildren()
      for (const doc of docs) {
        const row = document.createElement("div")
        row.className = "file-row"
        const name = document.createElement("span")
        name.textContent = doc.name
        name.title = doc.name
        const del = document.createElement("button")
        del.type = "button"
        del.textContent = "Delete"
        del.addEventListener("click", () => onDelete(doc.id))
        row.append(name, del)
        list.append(row)
      }
      clear.hidden = docs.length === 0
      all.hidden = claimDocs.length === 0 && recordDocs.length === 0
    }

    function render() {
      renderPile("claim-list", "clear-claim", claimDocs, (id) => {
        const i = claimDocs.findIndex((d) => d.id === id)
        if (i !== -1) claimDocs.splice(i, 1)
        render()
      })
      renderPile("record-list", "clear-record", recordDocs, (id) => {
        const i = recordDocs.findIndex((d) => d.id === id)
        if (i !== -1) recordDocs.splice(i, 1)
        render()
      })
    }

    async function appendFiles(input, docs) {
      const files = [...input.files]
      input.value = ""
      for (const f of files) {
        if (!ALLOWED.has(extensionOf(f.name))) continue
        const text = await f.text()
        if (!text) continue
        docs.push({ id: String(nextId++), name: f.name, text })
      }
      render()
    }

    function clearPile(docs) {
      docs.splice(0, docs.length)
      render()
    }

    document.getElementById("claim").addEventListener("change", (e) => appendFiles(e.target, claimDocs))
    document.getElementById("record").addEventListener("change", (e) => appendFiles(e.target, recordDocs))
    document.getElementById("clear-claim").addEventListener("click", () => clearPile(claimDocs))
    document.getElementById("clear-record").addEventListener("click", () => clearPile(recordDocs))
    document.getElementById("clear-all").addEventListener("click", () => {
      claimDocs.splice(0, claimDocs.length)
      recordDocs.splice(0, recordDocs.length)
      document.getElementById("out").replaceChildren()
      render()
    })
    document.getElementById("run").addEventListener("click", async () => {
      const out = document.getElementById("out")
      out.textContent = "running…"
      const body = {
        subject: document.getElementById("subject").value,
        claim: payload(claimDocs),
        record: payload(recordDocs),
        client: document.getElementById("client").value,
        narrate: document.getElementById("narrate").checked,
      }
      const res = await fetch("/assay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      const data = await res.json()
      if (!res.ok) { out.innerHTML = `<p class="refusal">${data.error}</p>`; return }
      const r = data.result
      const a = r.audit ?? {}
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
      }
      function denialTally(denied) {
        const counts = new Map()
        for (const d of denied ?? []) {
          const code = d.code ?? "?"
          counts.set(code, (counts.get(code) ?? 0) + 1)
        }
        return [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([code, n]) => `${n} ${code}`)
          .join(", ")
      }
      function formatAudit(audit) {
        const denials = denialTally(audit.denied)
        const denialPart = denials ? ` Denials: ${escapeHtml(denials)}.` : ""
        const previews = (audit.claimantOmittedPreviews ?? []).filter(Boolean)
        const list = previews.length
          ? `<ul>${previews.map((p) => `<li>${escapeHtml(p)}</li>`).join("")}</ul>`
          : ""
        return `<div class="audit"><p>Coverage ${audit.claimantCovered ?? "?"} / ${audit.claimantChunks ?? "?"} claimant chunks (${audit.claimantOmitted ?? "?"} omitted). Proposed ${audit.proposed ?? "?"} / admitted ${audit.admitted ?? "?"}. Record docs on ledger: ${audit.independentDocsAdmitted ?? "?"} / ${audit.independentDocsTotal ?? "?"}. Issue-statement denials: ${audit.issueStatementDenied ?? 0}. Holding-competitor denials: ${audit.holdingCompetitorDenied ?? 0}. Context-unverified: ${audit.contextUnverified ?? 0}.${denialPart}</p>${list}</div>`
      }
      const auditLine = formatAudit(a)
      if (r.outcome === "refusal") {
        out.innerHTML = `<p class="refusal">Refusal: ${r.reason}</p><p>${r.detail ?? ""}</p>${auditLine}`
        return
      }
      const labels = r.labels ?? { claimant: "Claim", independent: "Record" }
      const html = (r.rows ?? []).map((row) => {
        const sides = (row.sides ?? []).map((s) => {
          const doc = (r.docs ?? []).find((d) => d.docId === s.docId)
          const role = doc?.role === "claimant" ? labels.claimant : labels.independent
          return `<div><strong>${role}</strong> ${doc?.label ?? s.docId}<blockquote>${s.text}</blockquote></div>`
        }).join("")
        const prov = row.provenance ? ` [${row.provenance.class}]` : ""
        return `<div class="row ${row.status}"><span class="tag ${row.status}">${row.status}</span> — ${row.statement}${prov}${sides}</div>`
      }).join("")
      const nar = data.narrative?.paragraphs?.length
        ? `<h2>Narrative</h2>` + data.narrative.paragraphs.map((p) => `<p>${p.text}</p>`).join("")
        : ""
      out.innerHTML = auditLine + html + nar + auditLine
    })
  </script>
</body>
</html>
